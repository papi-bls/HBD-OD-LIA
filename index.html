<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour Odélia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a0f1f;--bg2:#4a1530;--rose:#f4a6b8;--gold:#e8c987;--ink:#fff1ee;--soft:#d9a9b6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a0f1f}}
:root[data-theme="dark"]{--bg:#2a0f1f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 45%,var(--bg) 100%);color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-weight:300;overflow-x:hidden;min-height:100vh}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
section{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1.6s ease,transform 1.6s ease}
.reveal.in{opacity:1;transform:none}
#hero{gap:0;padding:0}
.beat{min-height:75svh;display:flex;align-items:center;justify-content:center;width:100%;padding:0 1.5rem}
.beat:first-child{min-height:100svh;flex-direction:column;gap:1rem}
.swipe{font-size:1.5rem;font-style:italic;color:var(--rose)}
.arrow{font-size:2rem;color:var(--gold);animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.h1{font-size:clamp(2.4rem,11vw,3.4rem);font-style:italic;font-weight:400;color:var(--rose);line-height:1.1}
.name{font-size:clamp(4.2rem,24vw,7rem);font-style:italic;font-weight:600;line-height:1;background:linear-gradient(120deg,var(--gold),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.age{font-size:clamp(2rem,10vw,3rem);letter-spacing:.08em;color:var(--gold)}
.hint{position:absolute;bottom:calc(1.5rem + env(safe-area-inset-bottom,0px));font-size:.8rem;color:var(--soft);animation:bob 2s ease-in-out infinite}
h2{font-size:clamp(1.9rem,8vw,2.6rem);font-style:italic;font-weight:400;color:var(--rose);margin-bottom:.6rem;line-height:1.15}
p.sub{color:var(--soft);margin-bottom:2rem;max-width:30ch}
.dots{display:flex;gap:.9rem;margin-bottom:1.8rem}
.dots i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--gold)}
.dots i.on{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,4.2rem);gap:.8rem}
.pad button{height:4.2rem;border-radius:50%;border:1px solid rgba(244,166,184,.4);background:rgba(255,255,255,.05);color:var(--ink);font:400 1.5rem 'Cormorant Garamond',Georgia,serif;cursor:pointer;transition:background .2s,transform .1s}
.pad button:active{background:rgba(244,166,184,.3);transform:scale(.94)}
.shake{animation:sh .45s}
@keyframes sh{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#msg{min-height:1.6em;margin-top:1.4rem;color:var(--gold)}
#game{display:none}
#game.show{display:flex}
.row{display:flex;gap:.8rem;width:100%;max-width:420px;align-items:stretch;justify-content:center;margin:1.5rem 0 1rem;min-height:9rem}
.btn{border:0;border-radius:1.4rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;overflow:hidden;min-width:0;padding:.4rem;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;color:#3a1024;transition:flex-grow .7s ease,font-size .7s ease,opacity .6s ease,margin .6s ease}
.btn small{font:300 .75em 'Jost',sans-serif;font-style:normal;opacity:.75;transition:opacity .4s}
#a{background:var(--rose);flex:1 1 0}
#b{background:var(--gold);flex:1 1 0}
.btn.gone{flex-grow:0.0001!important;opacity:0;padding:0;margin-left:-.8rem;pointer-events:none}
.nosub small{opacity:0;height:0}
#warn{min-height:1.8em;color:var(--gold);font-size:1.15rem}
#final{display:none;padding:1rem}
#final.show{display:block}
#final p{font-size:clamp(1.8rem,8vw,2.6rem);font-style:italic;color:var(--rose);line-height:1.25}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}
#photo{padding:0;min-height:100svh}
#photo img{width:100%;height:100svh;object-fit:contain;display:block}
@media (prefers-reduced-motion:reduce){.reveal{transition:opacity .4s}.hint{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<section id="hero">
  <div class="beat"><div class="arrow">↑</div><div class="swipe serif">Glisse vers le haut</div></div>
  <div class="beat"><div class="h1 serif reveal">Joyeux Anniversaire</div></div>
  <div class="beat"><div class="name serif reveal">Odélia</div></div>
  <div class="beat"><div class="age serif reveal">17 ans</div></div>
  <div class="beat"><a class="reveal serif" href="#photo" style="color:var(--soft);font-style:italic;font-size:1.3rem;text-decoration:none">Il y a une surprise pour toi ↓</a></div>
</section>

<section id="lock">
  <h2 class="serif">Zone secrète</h2>
  <p class="sub">Entre le nombre qui nous représente sur Snapchat.</p>
  <div class="dots" id="dots"><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
  <div id="msg" aria-live="polite"></div>
</section>

<section id="game">
  <h2 class="serif">Qui aime le plus l’autre ?</h2>
  <div class="row" id="row">
    <button class="btn" id="a">C'est toi<small>Odélia</small></button>
    <button class="btn" id="b">Ou moi ?<small>Papi</small></button>
  </div>
  <div id="warn" aria-live="polite"></div>
  <div id="final"><p class="serif">Joyeux anniversaire, je t'aime énormément !</p></div>
</section>

<script>
const CODE='139';
let typed='';
const $=id=>document.getElementById(id);
const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

// Révélation au scroll
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.6});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

// Pavé numérique
const pad=$('pad');
['1','2','3','4','5','6','7','8','9','⌫','0','♥'].forEach(k=>{
  const b=document.createElement('button');b.textContent=k;b.setAttribute('aria-label',k);
  b.onclick=()=>press(k);pad.appendChild(b);
});
function paint(){[...$('dots').children].forEach((d,i)=>d.classList.toggle('on',i<typed.length))}
function press(k){
  if($('game').classList.contains('show'))return;
  if(k==='⌫'){typed=typed.slice(0,-1)}
  else if(k==='♥'){return}
  else if(typed.length<3){typed+=k}
  paint();
  if(typed.length===3){
    if(typed===CODE){
      $('msg').textContent='Déverrouillé ♥';
      setTimeout(()=>{$('game').classList.add('show');$('game').scrollIntoView({behavior:'smooth'})},700);
    }else{
      vib(200);$('msg').textContent='Ce n’est pas le bon code, réessaie.';
      const d=$('dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
      setTimeout(()=>{typed='';paint();$('msg').textContent=''},900);
    }
  }
}

// Jeu
let n=0;const A=$('a'),B=$('b'),warn=$('warn');
function sizes(){
  A.style.flexGrow=Math.pow(.5,n);A.style.fontSize=(1.6*Math.pow(.5,n))+'rem';
  B.style.flexGrow=Math.pow(2,n);B.style.fontSize=Math.min(1.6*Math.pow(1.5,n),6)+'rem';
}
sizes();
A.onclick=()=>{
  n++;warn.textContent='';
  $('row').classList.add('nosub');
  B.firstChild.nodeValue='Moi';
  sizes();
  if(n>=4){A.classList.add('gone');B.style.fontSize='4.5rem';B.style.minHeight='12rem'}
};
B.onclick=()=>{
  if(n===0||!A.classList.contains('gone')){vib(80);warn.textContent='Tu es sûre ?';return}
  B.disabled=true;B.style.pointerEvents='none';
  $('final').classList.add('show');
  boom();
};

// Feux d'artifice + confettis
const cv=$('fx'),cx=cv.getContext('2d');let P=[],run=false;
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
fit();addEventListener('resize',fit);
const cols=['#f4a6b8','#e8c987','#fff1ee','#ff6f91','#ffc2d1'];
function burst(x,y){
  const c=cols[Math.random()*cols.length|0];
  for(let i=0;i<70;i++){const a=Math.PI*2*i/70,s=2+Math.random()*4;
    P.push({t:'f',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c})}
  kick();
}
function kick(){if(!run){run=true;requestAnimationFrame(loop)}}
function confetti(){
  for(let i=0;i<8;i++)P.push({t:'c',x:Math.random()*innerWidth,y:-10,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,l:1,c:cols[Math.random()*cols.length|0]});
  kick();
}
function boom(){
  vib([100,50,100,50,300]);
  let k=0;
  const iv=setInterval(()=>{burst(innerWidth*(.15+Math.random()*.7),innerHeight*(.12+Math.random()*.4));confetti();if(++k>14)clearInterval(iv)},450);
  burst(innerWidth/2,innerHeight*.3);
  if(!run){run=true;requestAnimationFrame(loop)}
}
function loop(){
  const d=devicePixelRatio;cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  P=P.filter(p=>p.l>0&&p.y<innerHeight+20);
  P.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.t==='f'){p.vy+=.05;p.vx*=.985;p.l-=.011;cx.globalAlpha=Math.max(p.l,0);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,2.2,0,7);cx.fill()}
    else{p.r+=p.vr;p.l-=.0035;cx.globalAlpha=1;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-4,-2,8,4);cx.restore()}
  });
  if(P.length)requestAnimationFrame(loop);else run=false;
}
</script>
